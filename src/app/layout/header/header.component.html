<header class="header">
  <div class="header-top">
    <div class="header__container container">
      <div class="header_contact">
        <span>(+01) - 2345 - 67898</span>
        <span>Our Location</span>
      </div>
        <ng-container *ngIf="!authService.isLoggedIn()">
        <div style="display: flex;align-items: center;justify-content: center;color: #fff;gap: 18px;" >
            <a routerLink="/Authentication/login" class="auth-Section" >Login</a>
            <a routerLink="/Authentication/register" class="auth-Section" >SingUp</a>
        </div>
        </ng-container>
       <div
  class="user-box"
  *ngIf="authService.isLoggedIn()"
>
  <!-- user / admin icon -->
  <i
    class="fa-solid"
    [ngClass]="authService.isAdmin() ? 'fa-user-shield' : 'fa-user'"
  ></i>

  <!-- username -->
  <span class="username">
    {{ username }}
  </span>

  <!-- logout -->
  <i
    class="fa-solid fa-right-from-bracket logout"
    (click)="logOut()"
  ></i>
</div>

    
    </div>
    
  </div>

  <nav class="nav container">
    <a routerLink="/" class="nav__logo">
      <img src="assets/logo.svg" alt="Logo" class="nav__logo-img" />
    </a>

    <div class="nav__menu" id="nav-menu">
      <ul class="nav__list">
        <li class="nav__item">
          <a routerLink="/" class="nav__link active-link">Home</a>
        </li>
        <li class="nav__item">
          <a routerLink="products" class="nav__link">Shop</a>
        </li>
        <li class="nav__item">
          <a routerLink="/account" class="nav__link">My Account</a>
        </li>
        <li class="nav__item">
          <a routerLink="/contact" class="nav__link">Contact</a>
        </li>
      </ul>

      <!-- SEARCH -->
      <div class="header__search">
        <input
          type="text"
          placeholder="Search for items..."
          class="form__input"
        />

        <button class="search__btn">
          <img src="assets/search.png" alt="Search" />
        </button>
      </div>

      <!-- USER ACTIONS -->
      <div class="header__user-actions">
        <a  routerLink="WishList" class="header__action-btn">
          <img src="assets/icon-heart.svg" alt="Wishlist" />
          <span *ngIf="(wishlist$ | async)?.length as count"  class="count">
            {{count}}
          </span>
        </a>
        <a routerLink="Cart" class="header__action-btn">
          <img src="assets/icon-cart.svg" alt="Cart" />
      <span *ngIf="(Cart$ | async)?.length as count"  class="count">
            {{count}}
          </span>
        </a>
      </div>
    </div>
  </nav>
</header>
