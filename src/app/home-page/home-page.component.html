<div class="container-fluid my-4">
  <div class="row g-3">

    <!-- LEFT PROMOS -->
    <div class="col-lg-3 d-flex flex-column gap-3">
      <img src="assets/left-top.png" class="promo-img" />
      <img src="assets/left-bottom.png" class="promo-img" />
    </div>

    <!-- CENTER CAROUSEL -->
    <div class="col-lg-6">
      <div id="carouselExampleIndicators" class="carousel slide h-100" data-bs-ride="carousel">
        <div class="carousel-inner rounded-3 shadow">
          <div class="carousel-item active">
            <img src="assets/curasol-1.png" class="d-block w-100 main-slider" />
          </div>
          <div class="carousel-item">
            <img src="assets/curasol-2.png" class="d-block w-100 main-slider" />
          </div>
          <div class="carousel-item">
            <img src="assets/curasol-3.png" class="d-block w-100 main-slider" />
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT PROMOS -->
    <div class="col-lg-3 d-flex flex-column gap-3">
      <img src="assets/right-top.png" class="promo-img" />
      <img src="assets/right-bottom.png" class="promo-img" />
    </div>

  </div>
</div>
<div class="container my-5">
  <div class="product-head text-center mb-4">
    <h2>Featured Products</h2>
  </div>

  <div id="multiCardCarousel" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">

      <div
        *ngFor="let group of groupedProducts; let i = index"
        class="carousel-item"
        [class.active]="i === 0"
      >
        <div class="d-flex justify-content-center gap-4 flex-wrap">
          <div *ngFor="let product of group" class="product-card">
            <img [src]="product.thumbnail" alt="{{product.name}}" />
            <h6>{{ product.name }}</h6>
            <!-- <p class="price">Rs {{ product.price | number }}</p> -->
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
