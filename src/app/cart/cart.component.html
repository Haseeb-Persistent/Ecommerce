<!-- overlay -->
<div class="overlay" [class.show]="isOpen" (click)="close()"></div>

<div class="cart-drawer" [class.open]="isOpen">

  <!-- HEADER -->
  <div class="cart-header">
    <h5>
      <i style="color: var(--first-color);" class="fa fa-shopping-bag"></i>
      {{ (CartItem$ | async)?.length || 0 }} items
    </h5>

    <button (click)="close()">
      <i class="fa fa-times"></i>
    </button>
  </div>

  <!-- FREE SHIPPING -->
  <div class="free-ship">
    You are eligible for free shipping!
  </div>

  <!-- BODY -->
  <div class="cart-body">

    <ng-container *ngIf="CartItem$ | async as cartItems">

      <div
        class="cart-item"
        *ngFor="let item of cartItems; trackBy: trackById"
      >

        <img
          [src]="getImageUrl(item.product)"
          alt=""
        />

        <div class="info">
          <span>{{ item.product.name }}</span>
          <p *ngIf="item.product.isOnDiscount">
            <del>Rs. {{ item.product.orignalPrice }}</del>
          </p>

          <p style="color: var(--first-color);">
            Rs. {{ item.product.newPrice }}
          </p>

          <div class="qty">
            <button (click)="decrease(item.product.id)">-</button>
            <span>{{ item.quantity }}</span>
            <button (click)="increase(item.product.id)">+</button>
          </div>
        </div>

        <div class="price">
          Rs. {{ item.product.newPrice * item.quantity }}
        </div>

      </div>

    </ng-container>

  </div>

  <!-- FOOTER -->
  <div class="cart-footer">
    <button class="checkout-btn">
      <i class="fa fa-lock"></i>
      CHECKOUT · Rs. {{ totalPrice$ | async }} PKR
    </button>
  </div>

</div>
