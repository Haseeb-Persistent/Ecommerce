

<body>
<div class=" container login-wrapper d-flex align-items-center justify-content-center">
    <div class="login-card">

        <h3 class="login-title">Login</h3>

        <form>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control custom-input" >
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control custom-input" >
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox">
                    <label class="form-check-label">Remember me</label>
                </div>
                <a href="#" class="login-link">Forgot?</a>
            </div>

            <button type="submit" class="btn btn-login w-100">Login</button>

            <p class="text-center mt-4 mb-0">
                Don’t have an account?
                <a href="#" class="login-link fw-semibold" routerLink="../register">Sign up</a>
            </p>
        </form>

    </div>
</div>

</body>
