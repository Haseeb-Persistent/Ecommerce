<div class="login-wrapper d-flex align-items-center justify-content-center">
  <div class="login-card">

    <h3 class="login-title">Login</h3>

    <form [formGroup]="loginForm" (ngSubmit)="submitLogin()">

      <!-- Email -->
      <div class="input-group">
        <input type="email" class="custom-input" formControlName="email" placeholder=" " />
        <label>Email</label>
        <div class="error-text"
          *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('required')">
          Email is required
        </div>
        <div class="error-text"
          *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('email')">
          Enter a valid email
        </div>
      </div>

      <!-- Password -->
      <div class="input-group">
        <input type="password" class="custom-input" formControlName="password" placeholder=" " />
        <label>Password</label>
        <div class="error-text"
          *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')">
          Password is required
        </div>
      </div>

      <!-- Remember + Forgot -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" formControlName="remember" id="remember" />
          <label class="form-check-label" for="remember">Remember me</label>
        </div>
        <a href="#" class="login-link">Forgot?</a>
      </div>

      <!-- Login Button -->
      <button type="submit" class="btn btn-login w-100" >
        Login
      </button>

      <!-- Sign up redirect -->
      <p class="text-center mt-4 mb-0">
        Don’t have an account?
        <a href="#" class="login-link fw-semibold" routerLink="../register">Sign up</a>
      </p>

    </form>

  </div>
</div>
